<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Area Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .container {
            max-width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        label, input, button {
            display: block;
            width: 100%;
            margin-bottom: 10px;
        }
        input, button {
            padding: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Circle Area Calculator</h2>
        <form onsubmit="event.preventDefault(); calculateCircleArea();">
            <label for="radius">Enter Radius:</label>
            <input type="number" id="radius" step="any" placeholder="e.g. 5" required>
            <button type="submit">Calculate Area</button>
        </form>
        <p id="result"></p>
    </div>

    <script>
        function getCircleArea(radius) {
            return Math.PI * radius * radius;
        }

        function calculateCircleArea() {
            const radiusInput = document.getElementById("radius").value;
            const radius = parseFloat(radiusInput);

            if (isNaN(radius) || radius < 0) {
                document.getElementById("result").innerText = "Please enter a valid positive number.";
                return;
            }

            const area = getCircleArea(radius);
            document.getElementById("result").innerText = "Area: " + area.toFixed(2);
        }
    </script>

</body>
</html>
